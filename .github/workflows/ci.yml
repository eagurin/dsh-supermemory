name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Syntax, repository checks, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the config-schema dependency
        run: npm install --no-save --no-package-lock @deepseek-ai/schemastery@3.19.0
      - name: Syntax check
        run: node --check index.js
      - name: Manifest, patch, locales, docs, and secrets
        run: node scripts/check.mjs
      - name: Unit tests
        # `node --test test/` treats the directory as a module on Node 22; the
        # package script passes explicit test files instead, so CI and a local
        # `npm test` run exactly the same command.
        run: npm test
