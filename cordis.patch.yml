# Supermemory for DeepSeek Harness.
#
# `baseUrl` points at the Supermemory server that already holds the Hermes
# memory. The official Hermes plugin is configured for `npx supermemory local`
# on 127.0.0.1:6767, so the same server and the same API key serve both agents.
#
# `container` is this agent's own namespace: DeepSeek Harness writes only here.
# `readContainers` and `readPrefixes` make other agents' memory readable. Hermes
# is a different agent, so its containers stay read-only and every recalled fact
# is labeled with the container it came from.
- insert:
    - id: supermemory
      name: '@local/dsh-supermemory'
      config:
        # The local server's own default port. Hermes setups often run it on 6767:
        # change this value (or override `baseUrl`) if your server listens there.
        baseUrl: http://127.0.0.1:8787
        container: dsh
        # Cross-agent memory is opt-in: list another agent's namespaces here if you
        # want them recalled (read-only). Empty by default, so a fresh install
        # touches nothing but its own namespace.
        readContainers: []
        readPrefixes: []
        autoRecall: true
        autoCapture: true
        searchMode: hybrid
        maxRecallResults: 6
        profileFrequency: 20
        dreaming: instant
