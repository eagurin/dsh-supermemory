<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Two agents sharing one long-term memory store: one agent reads and writes, another is read-only">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="300" rx="18" fill="none"/>

  <!-- DeepSeek Harness: full access -->
  <g>
    <rect x="40" y="96" width="150" height="108" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <rect x="60" y="114" width="110" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="72" cy="128" r="4" fill="#6b7280"/>
    <circle cx="86" cy="128" r="4" fill="#cbd5e1"/>
    <circle cx="100" cy="128" r="4" fill="#cbd5e1"/>
    <path d="M 68 152 L 92 152 M 68 160 L 120 160" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 180 L 138 180" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- shared memory -->
  <g>
    <rect x="252" y="86" width="136" height="128" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <path d="M 272 118 L 368 118 M 272 140 L 368 140 M 272 162 L 344 162 M 272 184 L 356 184" stroke="#6366f1" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <circle cx="368" cy="106" r="6" fill="#6366f1"/>
  </g>

  <!-- Hermes: read-only -->
  <g>
    <rect x="450" y="96" width="150" height="108" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="470" y="114" width="110" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 478 152 L 502 152 M 478 160 L 530 160" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
    <rect x="470" y="180" width="36" height="12" rx="6" fill="#e5e7eb"/>
  </g>

  <!-- read/write path: own agent <-> memory -->
  <path d="M 192 132 L 250 132" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M 192 168 L 250 168" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- read-only path: memory -> other agent -->
  <path d="M 390 132 L 446 132" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowdash)"/>

  <!-- lock badge on the read-only path -->
  <g>
    <rect x="398" y="196" width="34" height="26" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <path d="M 407 196 L 407 189 A 8 8 0 0 1 423 189 L 423 196" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="415" cy="209" r="3" fill="#9ca3af"/>
  </g>
</svg>
